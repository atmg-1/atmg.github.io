# 叶同学博客 · Redefine 混合科幻配置
# 骨架：Redefine 现代审美 | 点缀：深蓝主色 + Banner + 首页打字机

info:
  title: 叶同学的博客
  subtitle: 探索科技与艺术的边界
  author: 叶同学
  url: https://atmg-1.github.io/atmg.github.io

defaults:
  favicon: /images/favicon-32x32-next.png
  logo:
  avatar: /images/avatar.jpg

colors:
  primary: "#2979FF"
  secondary:
  default_mode: dark

global:
  fonts:
    chinese:
      enable: false
      family:
      url:
    english:
      enable: false
      family:
      url:
    title:
      enable: false
      family:
      url:
  content_max_width: 1000px
  sidebar_width: 220px
  hover:
    shadow: true
    scale: true
  scroll_progress:
    bar: true
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: true
    site_pv: true
    site_uv: true
    post_pv: true
  single_page: true
  preloader:
    enable: false
    custom_message:
  side_tools:
    gear_rotation: true
    auto_expand: false
  open_graph:
    enable: true
    image: /images/redefine-og.webp
    description: 分享编程技术、科幻美学与创新思维的个人博客
  google_analytics:
    enable: false
    id:

fontawesome:
  thin: false
  light: false
  duotone: false
  sharp_solid: false

home_banner:
  enable: true
  style: fixed
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  title: 叶同学的博客
  subtitle:
    text:
      - 探索科技与艺术的边界
      - 代码 · 科幻 · 创造
    hitokoto:
      enable: false
      show_author: false
      api: https://v1.hitokoto.cn
    typing_speed: 70
    backing_speed: 40
    starting_delay: 300
    backing_delay: 1600
    loop: true
    smart_backspace: true
  text_color:
    light: "#ffffff"
    dark: "#E8F0FE"
  text_style:
    title_size: 2.9rem
    subtitle_size: 1.35rem
    line_height: 1.35
  custom_font:
    enable: false
    family:
    url:
  social_links:
    enable: true
    style: center
    links:
      - icon: fa-brands fa-github
        url: https://github.com/atmg-1
    qrs: []

navbar:
  auto_hide: true
  color:
    left: "#2979FF"
    right: "#00E5FF"
    transparency: 28
  width:
    home: 1200px
    pages: 1000px
  links:
    # 使用英文 key，由主题 i18n 显示为「首页」等；覆盖默认 Home，避免重复
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-archive
    Tags:
      path: /tags
      icon: fa-regular fa-tags
    Categories:
      path: /categories
      icon: fa-regular fa-folder
    About:
      path: /about
      icon: fa-regular fa-user
    Friends:
      path: /friends
      icon: fa-regular fa-link
  search:
    enable: true
    preload: true

home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: 探索科技与艺术的边界
    show_on_mobile: true
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-archive
      Tags:
        path: /tags
        icon: fa-regular fa-tags
      Categories:
        path: /categories
        icon: fa-regular fa-folder
  article_date_format: auto
  excerpt_length: 120
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3

articles:
  style:
    font_size: 16px
    line_height: 1.75
    image_border_radius: 16px
    image_alignment: center
    image_caption: false
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 2.6rem
      h2: 2.1rem
      h3: 1.7rem
      h4: 1.45rem
      h5: 1.25rem
      h6: 1.15rem
  word_count:
    enable: false
    count: false
    min2read: false
  author_label:
    enable: true
    auto: false
    list: []
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: vs2015
    font:
      enable: false
      family:
      url:
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: false
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: false
  recommendation:
    enable: false
    title: 推荐阅读
    limit: 3
    mobile_limit: 2
    placeholder: /images/wallhaven-wqery6-dark.webp
    skip_dirs: []

comment:
  enable: false
  system: gitalk
  config:
    gitalk:
      clientID:
      clientSecret:
      repo:
      owner:
      proxy:

footer:
  runtime: true
  icon: '<i class="fa-solid fa-rocket" style="color: #2979FF"></i>'
  start: 2025/12/30 00:00:00
  statistics: true
  customize: © 叶同学 · 探索科技与艺术的边界
  icp:
    enable: false
    number:
    url:

inject:
  enable: true
  head:
    - <link rel="stylesheet" href="/atmg.github.io/css/custom-sci-fi.css">
  footer:
    - <script src="/atmg.github.io/js/typewriter-effect.js"></script>

plugins:
  feed:
    enable: true
  aplayer:
    enable: false
    type: fixed
    audios: []
  mermaid:
    enable: false
    version: "11.4.1"
    theme:
      light: default
      dark: dark

page_templates:
  friends_column: 2
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

cdn:
  enable: false
  provider: jsdelivr
  custom_url:

developer:
  enable: false
